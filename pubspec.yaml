name: baka
description: A cross-platform, rule-driven anime aggregation and media player.
homepage: https://github.com/AniBakaBaka/AniBaka
repository: https://github.com/AniBakaBaka/AniBaka
issue_tracker: https://github.com/AniBakaBaka/AniBaka/issues

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 5.2.1+1007

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  app_links: ^7.2.2
  # 2.x uses material_ui ColorScheme; the app still uses Flutter Material.
  dynamic_color: ^1.9.0
  flutter_svg: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  fluttertoast: ^10.0.2
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^10.3.4
  flutter_staggered_grid_view: ^0.7.0
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  ios_orientation: ^0.0.7
  webview_flutter: ^4.14.1
  webview_windows: ^0.4.0
  # 13.x requires Android compileSdk 37; this app builds with 36.
  permission_handler: ^12.0.3

  # Upstream fork: omit Windows brightness registration to preserve HDR output.
  screen_brightness:
    git:
      url: https://github.com/AniBakaBaka/screen_brightness.git
      ref: df73d230307caee2d1910f254eeacdc3d360c204
      path: screen_brightness
  crypto: ^3.0.7
  encrypt: ^5.0.3
  # 4.x migrates to the separate material_ui package.
  cached_network_image: ^3.4.1
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9
  html: ^0.15.7
  xpath_selector_html_parser: ^3.0.1
  flutter_displaymode: ^0.7.0
  audio_video_progress_bar: ^2.0.3
  get: ^4.7.3
  media_kit: ^1.2.6 # Primary package.
  # Upstream fork: Windows video bridge, enabled in windows/CMakeLists.txt.
  media_kit_video:
    git:
      url: https://github.com/AniBakaBaka/media-kit.git
      ref: 12e1fdd72ffec6ef08f2f1b78490ca95632be4d5
      path: media_kit_video
  media_kit_libs_video: ^1.0.7
  flutter_volume_controller: ^2.0.2
  dlna_dart: ^0.1.1
  saver_gallery: ^4.1.2
  # 12.4.0 calls an iOS 26 SDK selector that Xcode 16 cannot compile.
  device_info_plus: 12.3.0
  file_picker: ^11.0.3
  bitsdojo_window: ^0.1.6
  fullscreen_window: ^1.2.1
  open_filex: ^4.7.0
  google_fonts: ^8.2.1
  audio_service: ^0.18.19
  package_info_plus: ^8.3.1
  win32_registry: ^2.1.0

  http_parser: ^4.1.2
  flutter_cache_manager: ^3.4.5
  file: ^7.0.1
  xml: ^6.6.1
  share_plus: ^12.0.2
  archive: ^4.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.31.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/ic_launcher.png
    - assets/watch_party_create.png
    - assets/watch_party_join.png
    - assets/bangumi.svg
    - assets/Search.svg
    - assets/more.svg
    - assets/dot-circle.svg
    - assets/compass.svg
    - assets/message-circle.svg
    - assets/smiling-face.svg
    - assets/compass-outline.svg
    - assets/message-circle-outline.svg
    - assets/smiling-face-outline.svg
    - assets/dahuiyuan.svg
    - assets/upzhu.svg
    - assets/li-font.svg
    - assets/eva-icons-LICENSE.txt
    - assets/anime4k/
    # Only built-in rules are shipped. Community rules come from AniBakaRule.
    - assets/rules/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
