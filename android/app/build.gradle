
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Keep packaged native libraries aligned with Flutter's --target-platform.
// CI builds one v7 APK, one v8 APK, and one APK containing both ARM ABIs.
def flutterAbiByTargetPlatform = [
    'android-arm'  : 'armeabi-v7a',
    'android-arm64': 'arm64-v8a',
]
def requestedFlutterPlatforms = (
    project.findProperty('target-platform') ?: 'android-arm,android-arm64'
).toString().split(',')
def requestedFlutterAbis = requestedFlutterPlatforms
    .collect { flutterAbiByTargetPlatform[it.trim()] }
    .findAll { it != null }
    .unique()
if (requestedFlutterAbis.isEmpty()) {
    requestedFlutterAbis = ['armeabi-v7a', 'arm64-v8a']
}

android {
    namespace "ani.baka"
    compileSdkVersion 36
    buildToolsVersion "34.0.0"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "ani.baka"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true

    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            ndk {
                abiFilters.clear()
                abiFilters.addAll(requestedFlutterAbis)
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            ndk {
                abiFilters.clear()
                abiFilters.addAll(requestedFlutterAbis)
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            excludes += ['lib/x86/**', 'lib/x86_64/**']
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
