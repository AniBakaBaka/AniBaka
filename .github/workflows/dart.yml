name: Build and Release

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android packages"
        required: true
        type: boolean
        default: true
      build_ios:
        description: "Build iOS package"
        required: true
        type: boolean
        default: true
      build_macos:
        description: "Build macOS packages"
        required: true
        type: boolean
        default: true
      build_windows:
        description: "Build Windows packages"
        required: true
        type: boolean
        default: true
      build_linux:
        description: "Build Linux packages"
        required: true
        type: boolean
        default: true
      release_type:
        description: "创建预发布或正式 GitHub Release"
        required: true
        type: choice
        default: prerelease
        options:
          - prerelease
          - release
      release_name:
        description: "可选的 Release 标题，留空时使用完整版本号"
        required: false
        type: string
      release_notes:
        description: "可选的 Release 正文，留空时自动生成"
        required: false
        type: string
      draft_release:
        description: "创建草稿 Release"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FASTFORGE_VERSION: 0.6.9
  ANDROID_SIGNING_CERT_SHA256: FF6D2DCA832EA3D9B20C20F21B33D124D8C239B2EDFAC382DB77740D23935B11

jobs:
  build-android:
    name: Android packages
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Configure Android signing
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash .github/scripts/setup-android-signing.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build APKs
        run: |
          flutter build apk --release --no-pub --split-per-abi --target-platform android-arm,android-arm64
          flutter build apk --release --no-pub --target-platform android-arm,android-arm64

      - name: Stage Android artifacts
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')
          mkdir -p release-stage
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release-stage/baka-${version}-android-armv7.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release-stage/baka-${version}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release-stage/baka-${version}-android-universal.apk"
          echo "sha256=${{ steps.android_signing.outputs.fingerprint }}" > "release-stage/baka-${version}-android-signing-metadata.txt"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-stage/*
          retention-days: 1

  build-ios:
    name: iOS package
    if: ${{ inputs.build_ios }}
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')
          mkdir -p build/ios/unsigned-ipa/Payload release-stage
          ditto build/ios/iphoneos/Runner.app build/ios/unsigned-ipa/Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/unsigned-ipa/Payload "release-stage/baka-${version}-ios-unsigned.ipa"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: release-stage/*
          retention-days: 1

  build-macos:
    name: macOS ${{ matrix.asset_arch }} packages
    if: ${{ inputs.build_macos }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            xcode_arch: x86_64
            asset_arch: x86_64
          - runner: macos-15
            xcode_arch: arm64
            asset_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Configure macOS signing
        id: macos_signing
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/setup-macos-signing.sh

      - name: Build, sign, and package macOS app
        env:
          TARGET_ARCH: ${{ matrix.xcode_arch }}
          FLUTTER_XCODE_ARCHS: ${{ matrix.xcode_arch }}
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: "YES"
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
          SIGNING_IDENTITY: ${{ steps.macos_signing.outputs.identity }}
          SIGNING_KEYCHAIN: ${{ steps.macos_signing.outputs.keychain }}
          USE_TIMESTAMP: ${{ steps.macos_signing.outputs.timestamp }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          flutter build macos --release --no-pub

          product_name=$(sed -n 's/^[[:space:]]*PRODUCT_NAME[[:space:]]*=[[:space:]]*//p' macos/Runner/Configs/AppInfo.xcconfig | head -n 1 | tr -d '\r')
          app_path="build/macos/Build/Products/Release/${product_name}.app"
          executable_path="$app_path/Contents/MacOS/$product_name"
          if [ ! -x "$executable_path" ]; then
            echo "::error::macOS executable was not found at $executable_path."
            exit 1
          fi
          actual_archs=$(lipo -archs "$executable_path")
          if [ "$actual_archs" != "$TARGET_ARCH" ]; then
            echo "::error::Expected macOS architecture $TARGET_ARCH, got $actual_archs."
            exit 1
          fi

          timestamp_option=
          if [ "$USE_TIMESTAMP" = "true" ]; then
            timestamp_option=--timestamp
          fi
          for directory in "$app_path/Contents/Frameworks" "$app_path/Contents/PlugIns"; do
            [ -d "$directory" ] || continue
            while IFS= read -r -d '' item; do
              codesign --force --deep --verbose --options runtime ${timestamp_option:+"$timestamp_option"} --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" "$item"
            done < <(find "$directory" -mindepth 1 -maxdepth 1 -print0)
          done
          codesign --force --deep --verbose --options runtime ${timestamp_option:+"$timestamp_option"} --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" "$app_path"
          codesign --verify --deep --strict --verbose "$app_path"

          version=$(sed -n 's/^[[:space:]]*version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')
          mkdir -p release-stage
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release-stage/baka-${version}-macos-${ASSET_ARCH}.zip"

          dmg_root=$(mktemp -d "$RUNNER_TEMP/baka-dmg.XXXXXX")
          ditto "$app_path" "$dmg_root/${product_name}.app"
          ln -s /Applications "$dmg_root/Applications"
          dmg_path="release-stage/baka-${version}-macos-${ASSET_ARCH}.dmg"
          hdiutil create -quiet -volname baka -srcfolder "$dmg_root" -format UDZO -ov "$dmg_path"
          codesign --force --verbose ${timestamp_option:+"$timestamp_option"} --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" "$dmg_path"
          codesign --verify --verbose "$dmg_path"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.asset_arch }}
          path: release-stage/*
          retention-days: 1

      - name: Clean up signing keychain
        if: always()
        env:
          SIGNING_KEYCHAIN: ${{ steps.macos_signing.outputs.keychain }}
        run: |
          if [ -n "$SIGNING_KEYCHAIN" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

  build-windows:
    name: Windows x64 packages
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Configure Windows signing
        id: windows_signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pwsh .github/scripts/setup-windows-signing.ps1

      - name: Sync MSIX version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^\s*version:\s*(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?\s*$' | Select-Object -First 1
          if ($null -eq $versionLine) { throw 'pubspec.yaml version format error' }
          $match = $versionLine.Matches[0]
          $buildNumber = if ($match.Groups[4].Success) { [int]$match.Groups[4].Value } else { [int]$env:GITHUB_RUN_NUMBER }
          $parts = @(
            [int]$match.Groups[1].Value
            [int]$match.Groups[2].Value
            [int]$match.Groups[3].Value
            $buildNumber
          )
          foreach ($part in $parts) {
            if ($part -lt 0 -or $part -gt 65535) { throw "MSIX version segment out of range: $part" }
          }
          $configPath = 'windows/packaging/msix/make_config.yaml'
          $config = (Get-Content -Raw -Encoding utf8 -LiteralPath $configPath) -replace '(?m)^msix_version:\s*\S+\s*$', "msix_version: $($parts -join '.')"
          Set-Content -Encoding utf8 -NoNewline -LiteralPath $configPath -Value $config

      - name: Build Windows packages once
        shell: pwsh
        run: |
          dart pub global activate fastforge "$env:FASTFORGE_VERSION"
          dart pub global run fastforge:main package --platform=windows --targets=exe,msix --skip-clean --flutter-build-args=no-pub

      - name: Sign and stage Windows artifacts
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certPath = '${{ steps.windows_signing.outputs.certificate_path }}'
          $signtool = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Select-Object -First 1 -ExpandProperty FullName
          if ([string]::IsNullOrWhiteSpace($signtool)) { throw 'signtool.exe was not found' }

          $buildFiles = Get-ChildItem 'build/windows/x64/runner/Release' -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll' }
          $packageFiles = Get-ChildItem dist -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msix' }
          foreach ($file in @($buildFiles) + @($packageFiles)) {
            & $signtool sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed to sign $($file.FullName)" }
          }

          $version = (Select-String -Path pubspec.yaml -Pattern '^\s*version:\s*(\S+)\s*$').Matches.Groups[1].Value
          New-Item -ItemType Directory -Path release-stage -Force | Out-Null
          foreach ($file in $packageFiles) {
            $target = "release-stage/baka-${version}-windows-x64$($file.Extension.ToLowerInvariant())"
            if (Test-Path -LiteralPath $target) { throw "Duplicate Windows package extension: $($file.Extension)" }
            Copy-Item -LiteralPath $file.FullName -Destination $target
          }
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath "release-stage/baka-${version}-windows-x64.zip" -CompressionLevel Optimal

          Copy-Item '${{ steps.windows_signing.outputs.public_certificate_path }}' "release-stage/baka-${version}-windows-certificate.cer"
          Copy-Item '.github/scripts/install-windows-msix.ps1' "release-stage/baka-${version}-windows-install.ps1"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-stage/*
          retention-days: 1

  build-linux:
    name: Linux x64 packages
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv appstream
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          sudo install "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Linux packages once
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          dart pub global activate fastforge "$FASTFORGE_VERSION"
          dart pub global run fastforge:main package --platform=linux --targets=appimage,deb,zip --skip-clean --flutter-build-args=no-pub

      - name: Stage Linux artifacts
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')
          mkdir -p release-stage
          count=0
          while IFS= read -r -d '' artifact; do
            case "$artifact" in
              *.AppImage) target="release-stage/baka-${version}-linux-x64.AppImage" ;;
              *.deb) target="release-stage/baka-${version}-linux-amd64.deb" ;;
              *.zip) target="release-stage/baka-${version}-linux-x64.zip" ;;
              *) continue ;;
            esac
            cp "$artifact" "$target"
            count=$((count + 1))
          done < <(find dist -type f -print0)
          if [ "$count" -ne 3 ]; then
            echo "::error::Expected 3 Linux packages, staged $count."
            exit 1
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-stage/*
          retention-days: 1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build-android
      - build-ios
      - build-macos
      - build-windows
      - build-linux
    if: >-
      ${{
        !cancelled() &&
        (inputs.build_android || inputs.build_ios || inputs.build_macos || inputs.build_windows || inputs.build_linux) &&
        (!inputs.build_android || needs.build-android.result == 'success') &&
        (!inputs.build_ios || needs.build-ios.result == 'success') &&
        (!inputs.build_macos || needs.build-macos.result == 'success') &&
        (!inputs.build_windows || needs.build-windows.result == 'success') &&
        (!inputs.build_linux || needs.build-linux.result == 'success')
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release metadata
        id: release_meta
        run: |
          version=$(sed -n 's/^[[:space:]]*version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')
          prerelease=false
          if [ "${{ inputs.release_type }}" = "prerelease" ]; then
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Sign release artifacts with GPG
        id: release_signing
        env:
          RELEASE_BASENAME: baka-${{ steps.release_meta.outputs.version }}-release
          RELEASE_GPG_PRIVATE_KEY_BASE64: ${{ secrets.RELEASE_GPG_PRIVATE_KEY_BASE64 }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: bash .github/scripts/gpg-sign-artifacts.sh

      - name: Publish release
        if: ${{ inputs.build_android && inputs.build_ios && inputs.build_macos && inputs.build_windows && inputs.build_linux }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.version }}
          name: ${{ inputs.release_name || steps.release_meta.outputs.version }}
          body: ${{ inputs.release_notes }}
          generate_release_notes: ${{ inputs.release_notes == '' }}
          draft: ${{ inputs.draft_release }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: release-assets/*

      - name: Add selected assets to existing release
        if: ${{ !(inputs.build_android && inputs.build_ios && inputs.build_macos && inputs.build_windows && inputs.build_linux) }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.version }}
          fail_on_unmatched_files: true
          files: release-assets/*
