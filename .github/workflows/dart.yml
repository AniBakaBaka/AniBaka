name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "创建预发布或正式 GitHub Release"
        required: true
        type: choice
        default: prerelease
        options:
          - prerelease
          - release
      release_name:
        description: "可选的 GitHub Release 标题；留空时使用标签名"
        required: false
        type: string
      release_notes:
        description: "可选的 GitHub Release 正文；留空时自动生成更新记录"
        required: false
        type: string
      draft_release:
        description: "先创建草稿，以便在 GitHub 中继续编辑后再发布"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FASTFORGE_VERSION: 0.6.9
  ANDROID_SIGNING_CERT_SHA256: FF6D2DCA832EA3D9B20C20F21B33D124D8C239B2EDFAC382DB77740D23935B11

jobs:
  # ==========================================
  # Android Platform Build
  # ==========================================
  build-android:
    name: Android packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Configure Android signing key
        id: android_signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash .github/scripts/setup-android-signing.sh

      - name: Prepare project
        run: flutter pub get

      - name: Build Android packages
        run: |
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          flutter build apk --release

      - name: Stage Android artifacts
        run: |
          version=$(sed -n 's/^\s*version:\s*\([^+]*\)+.*/\1/p' pubspec.yaml)
          mkdir -p release-stage
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release-stage/AniBaka-v${version}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release-stage/AniBaka-v${version}-android-universal.apk"
          echo "sha256=${{ steps.android_signing.outputs.fingerprint }}" > release-stage/signing-metadata.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-stage/*
          retention-days: 1

  # ==========================================
  # iOS Platform Build
  # ==========================================
  build-ios:
    name: iOS packages
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true

      - name: Prepare project
        run: |
          flutter pub get
          if [ -f ios/Podfile ]; then
            cd ios && pod install --repo-update && cd ..
          fi

      - name: Build iOS unsigned bundle
        run: flutter build ios --release --no-codesign

      - name: Stage iOS artifacts
        run: |
          version=$(sed -n 's/^\s*version:\s*\([^+]*\)+.*/\1/p' pubspec.yaml)
          mkdir -p release-stage
          tar -czf "release-stage/AniBaka-v${version}-ios-unsigned.tar.gz" -C build/ios/iphoneos Runner.app

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: release-stage/*
          retention-days: 1

  # ==========================================
  # macOS Platform Build
  # ==========================================
  build-macos:
    name: macOS packages
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true

      - name: Prepare project
        run: |
          flutter config --enable-macos-desktop
          flutter pub get

      - name: Setup macOS signing identity
        id: macos_signing
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/setup-macos-signing.sh

      - name: Build and sign macOS app
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ steps.macos_signing.outputs.identity }}
          SIGNING_KEYCHAIN: ${{ steps.macos_signing.outputs.keychain }}
        run: |
          dart pub global activate fastforge "$FASTFORGE_VERSION"
          options=("-p" "macos" "-t" "app" "-i" "$SIGNING_IDENTITY")
          if [ "${{ steps.macos_signing.outputs.timestamp }}" = "true" ]; then
            options+=("--timestamp")
          fi
          dart pub global run fastforge:main build "${options[@]}"

          app_path="build/macos/Build/Products/Release/AniBaka.app"
          find "$app_path/Contents/Frameworks" "$app_path/Contents/PlugIns" -mindepth 1 -maxdepth 1 2>/dev/null | while read -r item; do
            codesign --force --verbose --deep --options runtime --timestamp --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" "$item"
          done
          codesign --force --verbose --deep --options runtime --timestamp --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" "$app_path"
          codesign --verify --verbose --deep --strict "$app_path"

      - name: Build macOS packages (DMG, ZIP)
        shell: bash
        run: |
          dart pub global activate fastforge "$FASTFORGE_VERSION"
          export FASTFORGE_MACOS_SKIP_BUILD=true
          dart pub global run fastforge:main build -p macos -t dmg,zip

      - name: Sign macOS DMG
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ steps.macos_signing.outputs.identity }}
          SIGNING_KEYCHAIN: ${{ steps.macos_signing.outputs.keychain }}
        run: |
          for dmg_file in build/fastforge/macos/*.dmg; do
            [ -f "$dmg_file" ] || continue
            codesign --force --verbose --options runtime --timestamp --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" "$dmg_file"
            codesign --verify --verbose "$dmg_file"
          done

      - name: Clean up disposable keychain
        if: always()
        shell: bash
        run: |
          keychain_path="${{ steps.macos_signing.outputs.keychain }}"
          if [ -n "$keychain_path" ] && [ -f "$keychain_path" ]; then
            security delete-keychain "$keychain_path" || true
          fi

      - name: Stage macOS artifacts
        shell: bash
        run: |
          version=$(sed -n 's/^\s*version:\s*\([^+]*\)+.*/\1/p' pubspec.yaml)
          mkdir -p release-stage
          for artifact in build/fastforge/macos/*; do
            [ -f "$artifact" ] || continue
            ext="${artifact##*.}"
            cp "$artifact" "release-stage/AniBaka-v${version}-macos-universal.${ext}"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release-stage/*
          retention-days: 1

  # ==========================================
  # Windows Platform Build
  # ==========================================
  build-windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true

      - name: Free disk space
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force 'C:\Program Files\dotnet' -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force 'C:\hostedtoolcache\windows\CodeQL' -ErrorAction SilentlyContinue

      - name: Prepare project
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Configure Windows signing certificate
        id: windows_signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pwsh .github/scripts/setup-windows-signing.ps1

      - name: Sync MSIX version from pubspec
        shell: pwsh
        run: |
          $versionLine = Select-String -Path pubspec.yaml -Pattern '^\s*version:\s*(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?\s*$' | Select-Object -First 1
          if ($null -eq $versionLine) { throw 'pubspec.yaml version format error' }
          $parts = @([int]$versionLine.Matches[0].Groups[1].Value, [int]$versionLine.Matches[0].Groups[2].Value, [int]$versionLine.Matches[0].Groups[3].Value, if ($versionLine.Matches[0].Groups[4].Success) { [int]$versionLine.Matches[0].Groups[4].Value } else { [int]$env:GITHUB_RUN_NUMBER })
          $msixVersion = $parts -join '.'
          $configPath = 'windows/packaging/msix/make_config.yaml'
          $config = (Get-Content -Raw -Encoding utf8 -LiteralPath $configPath) -replace '(?m)^msix_version:\s*\S+\s*$', "msix_version: $msixVersion"
          Set-Content -Encoding utf8 -NoNewline -LiteralPath $configPath -Value $config

      - name: Build Windows packages
        shell: pwsh
        run: |
          dart pub global activate fastforge "$env:FASTFORGE_VERSION"
          dart pub global run fastforge:main build -p windows -t exe,msix,zip --no-sign

      - name: Sign Windows binaries
        shell: pwsh
        run: |
          $certPath = '${{ steps.windows_signing.outputs.certificate_path }}'
          $certPassword = $env:WINDOWS_CERTIFICATE_PASSWORD
          $signtool = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter 'signtool.exe' -Recurse | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1 -ExpandProperty FullName
          
          $filesToSign = @(
            'build/windows/x64/runner/Release/anibaka.exe'
            'build/windows/x64/runner/Release/*.dll'
            'build/fastforge/windows/*.exe'
          ) | ForEach-Object { Get-ChildItem $_ -ErrorAction SilentlyContinue } | Select-Object -ExpandProperty FullName -Unique

          foreach ($file in $filesToSign) {
            & $signtool sign /f $certPath /p $certPassword /tr http://timestamp.digicert.com /td sha256 /fd sha256 $file
          }

      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^\s*version:\s*([^+]+)').Matches.Groups[1].Value
          mkdir release-stage -ErrorAction SilentlyContinue
          Get-ChildItem 'build/fastforge/windows/*' | ForEach-Object {
            $ext = $_.Extension
            Copy-Item $_.FullName "release-stage/AniBaka-v${version}-windows-x64${ext}"
          }
          $certPath = '${{ steps.windows_signing.outputs.certificate_path }}'
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certPath, $env:WINDOWS_CERTIFICATE_PASSWORD)
          [IO.File]::WriteAllBytes("release-stage/AniBaka-v${version}-windows-certificate.cer", $cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-stage/*
          retention-days: 1

  # ==========================================
  # Linux Platform Build
  # ==========================================
  build-linux:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev appstream

      - name: Prepare project
        run: |
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Build Linux packages
        run: |
          dart pub global activate fastforge "$FASTFORGE_VERSION"
          dart pub global run fastforge:main package --platform=linux --targets=appimage,deb,zip

      - name: Stage Linux artifacts
        run: |
          version=$(sed -n 's/^\s*version:\s*\([^+]*\)+.*/\1/p' pubspec.yaml)
          mkdir -p release-stage
          for artifact in build/fastforge/linux/*; do
            [ -f "$artifact" ] || continue
            filename=$(basename "$artifact")
            case "$filename" in
              *.AppImage) target="release-stage/AniBaka-v${version}-linux-x64.AppImage" ;;
              *.deb) target="release-stage/AniBaka-v${version}-linux-amd64.deb" ;;
              *.zip) target="release-stage/AniBaka-v${version}-linux-x64.zip" ;;
              *) target="release-stage/AniBaka-v${version}-linux-${filename}" ;;
            esac
            cp "$artifact" "$target"
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-stage/*
          retention-days: 1

  # ==========================================
  # GitHub Release & GPG Signing
  # ==========================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-ios
      - build-macos
      - build-windows
      - build-linux
    if: always() && !cancelled()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release metadata
        id: release_meta
        run: |
          version=$(sed -n 's/^\s*version:\s*\([^+]*\)+.*/\1/p' pubspec.yaml)
          tag="v${version}"
          is_prerelease=false
          if [ "${{ inputs.release_type }}" = "prerelease" ]; then
            is_prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

      - name: Download successful package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: downloaded-artifacts

      - name: Prepare unique release asset names
        run: |
          mkdir -p release-assets
          count=0
          for artifact_dir in downloaded-artifacts/release-*; do
            [ -d "$artifact_dir" ] || continue
            artifact_name=$(basename "$artifact_dir")
            artifact_name=${artifact_name#release-}
            while IFS= read -r -d '' file; do
              cp "$file" "release-assets/${artifact_name}-$(basename "$file")"
              count=$((count + 1))
            done < <(find "$artifact_dir" -type f -print0)
          done
          if [ "$count" -eq 0 ]; then
            echo "No package was built successfully; GitHub Release was not created."
            exit 1
          fi
          ls -lah release-assets

      - name: Sign release artifacts with GPG
        id: release_signing
        shell: bash
        env:
          RELEASE_GPG_PRIVATE_KEY_BASE64: ${{ secrets.RELEASE_GPG_PRIVATE_KEY_BASE64 }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: bash .github/scripts/gpg-sign-artifacts.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ inputs.release_name || steps.release_meta.outputs.tag }}
          body: ${{ inputs.release_notes }}
          generate_release_notes: ${{ inputs.release_notes == '' }}
          draft: ${{ inputs.draft_release }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: release-assets/*
