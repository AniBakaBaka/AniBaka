name: Build and Release

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android packages"
        required: true
        type: boolean
        default: true
      build_ios:
        description: "Build iOS package"
        required: true
        type: boolean
        default: true
      build_macos:
        description: "Build macOS packages"
        required: true
        type: boolean
        default: true
      build_windows:
        description: "Build Windows packages"
        required: true
        type: boolean
        default: true
      build_linux:
        description: "Build Linux packages"
        required: true
        type: boolean
        default: true
      release_type:
        description: "创建预发布或正式 GitHub Release"
        required: true
        type: choice
        default: prerelease
        options:
          - prerelease
          - release
      release_name:
        description: "可选的 Release 标题，留空时使用完整版本号"
        required: false
        type: string
      release_notes:
        description: "可选的 Release 正文，留空时自动生成"
        required: false
        type: string
      draft_release:
        description: "创建草稿 Release"
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FASTFORGE_VERSION: 0.6.9
  ANDROID_SIGNING_CERT_SHA256: FF6D2DCA832EA3D9B20C20F21B33D124D8C239B2EDFAC382DB77740D23935B11

jobs:
  prepare:
    name: Prepare release metadata
    if: >-
      ${{
        inputs.build_android ||
        inputs.build_ios ||
        inputs.build_macos ||
        inputs.build_windows ||
        inputs.build_linux
      }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release version
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^[[:space:]]*version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?$ ]]; then
            echo "::error::Invalid pubspec.yaml version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-android:
    name: Android packages
    if: ${{ inputs.build_android }}
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;34.0.0"

      - name: Configure Android signing
        id: android_signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash .github/scripts/setup-android-signing.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build APKs
        run: |
          flutter build apk --release --no-pub --split-per-abi --target-platform android-arm,android-arm64
          flutter build apk --release --no-pub --target-platform android-arm,android-arm64

      - name: Stage Android artifacts
        run: |
          set -euo pipefail
          version=$RELEASE_VERSION
          mkdir -p release-stage
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release-stage/baka-${version}-android-armv7.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release-stage/baka-${version}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release-stage/baka-${version}-android-universal.apk"
          echo "sha256=${{ steps.android_signing.outputs.fingerprint }}" > "release-stage/baka-${version}-android-signing-metadata.txt"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-stage/*
          if-no-files-found: error
          retention-days: 1

  build-ios:
    name: iOS package
    if: ${{ inputs.build_ios }}
    needs: prepare
    runs-on: macos-15
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          version=$RELEASE_VERSION
          mkdir -p build/ios/unsigned-ipa/Payload release-stage
          ditto build/ios/iphoneos/Runner.app build/ios/unsigned-ipa/Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/unsigned-ipa/Payload "release-stage/baka-${version}-ios-unsigned.ipa"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: release-stage/*
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: macOS ${{ matrix.asset_arch }} packages
    if: ${{ inputs.build_macos }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            xcode_arch: x86_64
            asset_arch: x86_64
          - runner: macos-15
            xcode_arch: arm64
            asset_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Configure macOS signing
        id: macos_signing
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash .github/scripts/setup-macos-signing.sh

      - name: Build, sign, and package macOS app
        env:
          TARGET_ARCH: ${{ matrix.xcode_arch }}
          FLUTTER_XCODE_ARCHS: ${{ matrix.xcode_arch }}
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: "YES"
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
          SIGNING_IDENTITY: ${{ steps.macos_signing.outputs.identity }}
          SIGNING_KEYCHAIN: ${{ steps.macos_signing.outputs.keychain }}
          USE_TIMESTAMP: ${{ steps.macos_signing.outputs.timestamp }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          flutter build macos --release --no-pub

          product_name=$(sed -n 's/^[[:space:]]*PRODUCT_NAME[[:space:]]*=[[:space:]]*//p' macos/Runner/Configs/AppInfo.xcconfig | head -n 1 | tr -d '\r')
          app_path="build/macos/Build/Products/Release/${product_name}.app"
          executable_path="$app_path/Contents/MacOS/$product_name"
          if [ ! -x "$executable_path" ]; then
            echo "::error::macOS executable was not found at $executable_path."
            exit 1
          fi
          actual_archs=$(lipo -archs "$executable_path")
          if [ "$actual_archs" != "$TARGET_ARCH" ]; then
            echo "::error::Expected macOS architecture $TARGET_ARCH, got $actual_archs."
            exit 1
          fi

          timestamp_option=
          if [ "$USE_TIMESTAMP" = "true" ]; then
            timestamp_option=--timestamp
          fi
          for directory in "$app_path/Contents/Frameworks" "$app_path/Contents/PlugIns"; do
            [ -d "$directory" ] || continue
            while IFS= read -r -d '' item; do
              codesign --force --deep --verbose --options runtime ${timestamp_option:+"$timestamp_option"} --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" "$item"
            done < <(find "$directory" -mindepth 1 -maxdepth 1 -print0)
          done
          codesign --force --deep --verbose --options runtime ${timestamp_option:+"$timestamp_option"} --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" "$app_path"
          codesign --verify --deep --strict --verbose "$app_path"

          version=$RELEASE_VERSION
          mkdir -p release-stage

          dmg_root=$(mktemp -d "$RUNNER_TEMP/baka-dmg.XXXXXX")
          ditto "$app_path" "$dmg_root/${product_name}.app"
          ln -s /Applications "$dmg_root/Applications"
          dmg_path="release-stage/baka-${version}-macos-${ASSET_ARCH}.dmg"
          hdiutil create -quiet -volname baka -srcfolder "$dmg_root" -format UDZO -ov "$dmg_path"
          codesign --force --verbose ${timestamp_option:+"$timestamp_option"} --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" "$dmg_path"
          codesign --verify --verbose "$dmg_path"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.asset_arch }}
          path: release-stage/*
          if-no-files-found: error
          retention-days: 1

      - name: Clean up signing keychain
        if: always()
        env:
          SIGNING_KEYCHAIN: ${{ steps.macos_signing.outputs.keychain }}
        run: |
          if [ -n "$SIGNING_KEYCHAIN" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

  build-windows:
    name: Windows x64 packages
    if: ${{ inputs.build_windows }}
    needs: prepare
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Sync MSIX version
        shell: pwsh
        run: |
          $match = [regex]::Match($env:RELEASE_VERSION, '^(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?$')
          if (-not $match.Success) { throw "Invalid release version: $env:RELEASE_VERSION" }
          $buildNumber = if ($match.Groups[4].Success) { [int]$match.Groups[4].Value } else { [int]$env:GITHUB_RUN_NUMBER }
          $parts = @(
            [int]$match.Groups[1].Value
            [int]$match.Groups[2].Value
            [int]$match.Groups[3].Value
            $buildNumber
          )
          foreach ($part in $parts) {
            if ($part -lt 0 -or $part -gt 65535) { throw "MSIX version segment out of range: $part" }
          }
          $configPath = 'windows/packaging/msix/make_config.yaml'
          $config = (Get-Content -Raw -Encoding utf8 -LiteralPath $configPath) -replace '(?m)^msix_version:\s*\S+\s*$', "msix_version: $($parts -join '.')"
          Set-Content -Encoding utf8 -NoNewline -LiteralPath $configPath -Value $config

      - name: Build Windows packages once
        shell: pwsh
        run: |
          dart pub global activate fastforge "$env:FASTFORGE_VERSION"
          dart pub global run fastforge:main package --platform=windows --targets=exe,msix --skip-clean --flutter-build-args=no-pub

      - name: Stage unsigned Windows artifacts
        id: windows_release_meta
        shell: pwsh
        run: |
          $packageFiles = Get-ChildItem dist -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msix' }
          foreach ($extension in '.exe', '.msix') {
            $matches = @($packageFiles | Where-Object { $_.Extension -eq $extension })
            if ($matches.Count -ne 1) { throw "Expected exactly one Windows $extension package, found $($matches.Count)" }
          }

          $version = $env:RELEASE_VERSION
          "version=$version" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Path signpath-input -Force | Out-Null
          foreach ($file in $packageFiles) {
            $target = "signpath-input/baka-${version}-windows-x64$($file.Extension.ToLowerInvariant())"
            if (Test-Path -LiteralPath $target) { throw "Duplicate Windows package extension: $($file.Extension)" }
            Copy-Item -LiteralPath $file.FullName -Destination $target
          }
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath "signpath-input/baka-${version}-windows-x64.zip" -CompressionLevel Optimal

      - name: Upload unsigned Windows artifacts
        id: upload_unsigned_windows
        if: ${{ vars.SIGNPATH_RELEASE_SIGNING_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: signpath-unsigned-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: signpath-input/*
          if-no-files-found: error
          retention-days: 1

      - name: Submit Windows artifacts to SignPath
        id: signpath_windows
        if: ${{ vars.SIGNPATH_RELEASE_SIGNING_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ad88b2e9-2cf4-4984-b56b-4f4d2e575e15
          project-slug: AniBaka
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-release
          github-artifact-id: ${{ steps.upload_unsigned_windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 21600
          output-artifact-directory: ${{ github.workspace }}\signpath-output
          parameters: |
            version: ${{ toJSON(steps.windows_release_meta.outputs.version) }}

      - name: Validate and stage signed Windows artifacts
        if: ${{ vars.SIGNPATH_RELEASE_SIGNING_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $expectedNames = @(
            "baka-${version}-windows-x64.exe"
            "baka-${version}-windows-x64.msix"
            "baka-${version}-windows-x64.zip"
          )
          New-Item -ItemType Directory -Path release-stage -Force | Out-Null
          foreach ($name in $expectedNames) {
            $matches = @(Get-ChildItem signpath-output -Recurse -File | Where-Object { $_.Name -eq $name })
            if ($matches.Count -ne 1) { throw "Expected exactly one signed output named $name, found $($matches.Count)" }
            Copy-Item -LiteralPath $matches[0].FullName -Destination (Join-Path release-stage $name)
          }

          $expectedCommonName = 'SignPath Foundation'
          $signedFiles = @(
            "release-stage/baka-${version}-windows-x64.exe"
            "release-stage/baka-${version}-windows-x64.msix"
          )
          $portableDirectory = Join-Path $env:RUNNER_TEMP "anibaka-portable-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Expand-Archive -LiteralPath "release-stage/baka-${version}-windows-x64.zip" -DestinationPath $portableDirectory
          $portableExecutables = @(Get-ChildItem $portableDirectory -Recurse -File -Filter baka.exe)
          if ($portableExecutables.Count -ne 1) {
            throw "Expected exactly one portable baka.exe, found $($portableExecutables.Count)"
          }
          $signedFiles += $portableExecutables[0].FullName

          foreach ($file in $signedFiles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($null -eq $signature.SignerCertificate) { throw "SignPath did not sign $file" }
            $commonName = $signature.SignerCertificate.GetNameInfo(
              [Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
              $false
            )
            if ($commonName -ne $expectedCommonName) {
              throw "Unexpected signing certificate for ${file}: $($signature.SignerCertificate.Subject)"
            }
          }

      - name: Stage unsigned Windows artifacts while release signing is unavailable
        if: ${{ vars.SIGNPATH_RELEASE_SIGNING_ENABLED != 'true' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-stage -Force | Out-Null
          Copy-Item -Path 'signpath-input/*' -Destination release-stage
          "::warning::Release certificate 2026 is not enabled; publishing unsigned Windows artifacts."
          "### Windows code signing" >> $env:GITHUB_STEP_SUMMARY
          "Release certificate 2026 is not enabled, so these Windows artifacts are unsigned." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-stage/*
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Linux x64 packages
    if: ${{ inputs.build_linux }}
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
          pub-cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv appstream
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          sudo install "$RUNNER_TEMP/appimagetool" /usr/local/bin/appimagetool

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Linux packages once
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          dart pub global activate fastforge "$FASTFORGE_VERSION"
          dart pub global run fastforge:main package --platform=linux --targets=appimage,deb --skip-clean --flutter-build-args=no-pub

      - name: Stage Linux artifacts
        run: |
          set -euo pipefail
          version=$RELEASE_VERSION
          mkdir -p release-stage
          mapfile -d '' appimages < <(find dist -type f -name '*.AppImage' -print0)
          mapfile -d '' debs < <(find dist -type f -name '*.deb' -print0)
          if [ "${#appimages[@]}" -ne 1 ] || [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::Expected one AppImage and one DEB; found ${#appimages[@]} AppImage(s) and ${#debs[@]} DEB(s)."
            exit 1
          fi
          cp -- "${appimages[0]}" "release-stage/baka-${version}-linux-x64.AppImage"
          cp -- "${debs[0]}" "release-stage/baka-${version}-linux-amd64.deb"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-stage/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - prepare
      - build-android
      - build-ios
      - build-macos
      - build-windows
      - build-linux
    if: >-
      ${{
        !cancelled() &&
        needs.prepare.result == 'success' &&
        (inputs.build_android || inputs.build_ios || inputs.build_macos || inputs.build_windows || inputs.build_linux) &&
        (!inputs.build_android || needs.build-android.result == 'success') &&
        (!inputs.build_ios || needs.build-ios.result == 'success') &&
        (!inputs.build_macos || needs.build-macos.result == 'success') &&
        (!inputs.build_windows || needs.build-windows.result == 'success') &&
        (!inputs.build_linux || needs.build-linux.result == 'success')
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release metadata
        id: release_meta
        run: |
          echo "version=${{ needs.prepare.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${{ inputs.release_type == 'prerelease' }}" >> "$GITHUB_OUTPUT"

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Sign release artifacts with GPG
        id: release_signing
        env:
          RELEASE_BASENAME: baka-${{ steps.release_meta.outputs.version }}-release
          RELEASE_GPG_PRIVATE_KEY_BASE64: ${{ secrets.RELEASE_GPG_PRIVATE_KEY_BASE64 }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: bash .github/scripts/gpg-sign-artifacts.sh

      - name: Publish release
        if: ${{ inputs.build_android && inputs.build_ios && inputs.build_macos && inputs.build_windows && inputs.build_linux }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.version }}
          name: ${{ inputs.release_name || steps.release_meta.outputs.version }}
          body: ${{ inputs.release_notes }}
          generate_release_notes: ${{ inputs.release_notes == '' }}
          draft: ${{ inputs.draft_release }}
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: release-assets/*

      - name: Add selected assets to existing release
        if: ${{ !(inputs.build_android && inputs.build_ios && inputs.build_macos && inputs.build_windows && inputs.build_linux) }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.version }}
          fail_on_unmatched_files: true
          files: release-assets/*
