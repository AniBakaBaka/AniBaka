name: screen_brightness
description: Screen brightness wrapper without Windows native plugin registration.
version: 2.1.7
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  screen_brightness_platform_interface: ">=2.1.0 <3.0.0"
  screen_brightness_android: ">=2.1.3 <3.0.0"
  screen_brightness_ios: ">=2.1.2 <3.0.0"
  screen_brightness_macos: ">=2.1.1 <3.0.0"
  screen_brightness_ohos: ">=2.1.2 <3.0.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: screen_brightness_android
      ios:
        default_package: screen_brightness_ios
      macos:
        default_package: screen_brightness_macos
      ohos:
        default_package: screen_brightness_ohos